name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: yarn install --no-immutable
      - name: Normalize initial formatting
        run: yarn biome check --write .
      - run: yarn check-all
      - run: yarn test
      - run: yarn build
      - run: yarn playwright install --with-deps chromium
      - run: yarn test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: week3-checks
          path: |
            yarn.lock
            src/
            tests/
            e2e/
            *.json
            *.ts
            index.html
            dist/
            test-results/
